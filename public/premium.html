<!DOCTYPE html>
<html lang=\"pt-BR\">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>Ludo Conto Premium - Assine Agora</title>
    <link rel=\"stylesheet\" href=\"styles.css\">
    <link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">
    <style>
        .premium-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .premium-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .premium-header {
            margin-bottom: 30px;
        }
        
        .premium-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .premium-subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
        }
        
        .price-section {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .price {
            font-size: 3rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }
        
        .price-period {
            font-size: 1.1rem;
            color: #666;
        }
        
        .benefits {
            text-align: left;
            margin-bottom: 30px;
        }
        
        .benefit-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .benefit-icon {
            color: #10b981;
            margin-right: 15px;
            font-size: 1.3rem;
        }
        
        .cta-button {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        
        .cta-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .back-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class=\"premium-page\">
        <div class=\"premium-container\">
            <div class=\"premium-header\">
                <h1 class=\"premium-title\">🦥 Ludo Conto Premium</h1>
                <p class=\"premium-subtitle\">Historias ilimitadas com ilustracoes magicas</p>
            </div>
            
            <div class=\"price-section\">
                <div class=\"price\">R$ 9,99</div>
                <div class=\"price-period\">por mes</div>
            </div>
            
            <div class=\"benefits\">
                <div class=\"benefit-item\">
                    <span class=\"benefit-icon\">✅</span>
                    <span>Historias ilimitadas (uso justo: 1 por dia)</span>
                </div>
                <div class=\"benefit-item\">
                    <span class=\"benefit-icon\">✅</span>
                    <span>30 ilustracoes profissionais por mes</span>
                </div>
                <div class=\"benefit-item\">
                    <span class=\"benefit-icon\">✅</span>
                    <span>Perfis multiplos (ate 3 criancas)</span>
                </div>
                <div class=\"benefit-item\">
                    <span class=\"benefit-icon\">✅</span>
                    <span>Sem anuncios</span>
                </div>
                <div class=\"benefit-item\">
                    <span class=\"benefit-icon\">✅</span>
                    <span>Suporte prioritario</span>
                </div>
            </div>
            
            <div class=\"error-message\" id=\"error-message\"></div>
            
            <button class=\"cta-button\" id=\"subscribe-btn\" onclick=\"assinarPremium()\">
                <span class=\"btn-text\">Assinar Premium Agora</span>
                <div class=\"loading\" id=\"btn-loading\">
                    <div class=\"spinner\"></div>
                    <span>Processando...</span>
                </div>
            </button>
            
            <a href=\"/\" class=\"back-link\">← Voltar para o Ludo Conto</a>
        </div>
    </div>
    
    <!-- Firebase SDKs -->
    <script type=\"module\">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';
        
        const firebaseConfig = {
            apiKey: \"AIzaSyDH02CAV-mEtQhhPmRJRuxiVKCJak4N3GA\",
            authDomain: \"ludoconto.firebaseapp.com\",
            projectId: \"ludoconto\",
            storageBucket: \"ludoconto.firebasestorage.app\",
            messagingSenderId: \"608733666496\",
            appId: \"1:608733666496:web:b638178ee15d7ca0732125\",
            measurementId: \"G-004YJNNFN9\"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const functions = getFunctions(app);
        
        window.auth = auth;
        window.functions = functions;
        
        // Verificar se usuario esta logado
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // Redirecionar para login se nao estiver logado
                window.location.href = '/';
            } else {
                window.currentUser = user;
            }
        });
    </script>
    
    <script>
        async function assinarPremium() {
            const btn = document.getElementById('subscribe-btn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoading = btn.querySelector('.loading');
            const errorMessage = document.getElementById('error-message');
            
            try {
                // Verificar se usuario esta logado
                if (!window.currentUser) {
                    throw new Error('Voce precisa estar logado para assinar o Premium');
                }
                
                // Mostrar loading
                btn.disabled = true;
                btnText.style.display = 'none';
                btnLoading.style.display = 'flex';
                errorMessage.style.display = 'none';
                
                // Criar sessao de checkout
                const criarCheckoutFunction = httpsCallable(window.functions, 'criarCheckoutSession');
                const result = await criarCheckoutFunction({
                    priceId: 'price_1RqIPF0Tz9khDe1DHsKNCcwu',
                    successUrl: window.location.origin + '/sucesso.html',
                    cancelUrl: window.location.origin + '/premium.html'
                });
                
                // Redirecionar para Stripe Checkout
                window.location.href = result.data.url;
                
            } catch (error) {
                console.error('Erro ao assinar:', error);
                
                // Mostrar erro
                errorMessage.textContent = error.message || 'Erro ao processar pagamento. Tente novamente.';
                errorMessage.style.display = 'block';
                
                // Restaurar botao
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        }
    </script>
</body>
</html>"
