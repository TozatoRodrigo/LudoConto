<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Conto Premium - Assine Agora</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">
                    <svg class="logo-mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="50" cy="65" rx="25" ry="20" fill="#8B4513" stroke="#654321" stroke-width="2" />
                        <circle cx="50" cy="35" r="18" fill="#D2691E" stroke="#8B4513" stroke-width="2" />
                        <ellipse cx="30" cy="55" rx="8" ry="15" fill="#8B4513" transform="rotate(-30 30 55)" />
                        <ellipse cx="70" cy="55" rx="8" ry="15" fill="#8B4513" transform="rotate(30 70 55)" />
                        <ellipse cx="40" cy="80" rx="6" ry="12" fill="#8B4513" />
                        <ellipse cx="60" cy="80" rx="6" ry="12" fill="#8B4513" />
                        <circle cx="44" cy="30" r="4" fill="white" />
                        <circle cx="56" cy="30" r="4" fill="white" />
                        <circle cx="44" cy="30" r="2" fill="black" />
                        <circle cx="56" cy="30" r="2" fill="black" />
                        <ellipse cx="50" cy="38" rx="2" ry="1.5" fill="black" />
                        <path d="M 45 42 Q 50 47 55 42" stroke="black" stroke-width="2" fill="none"
                            stroke-linecap="round" />
                        <circle cx="42" cy="60" r="3" fill="#654321" />
                        <circle cx="58" cy="68" r="2.5" fill="#654321" />
                        <circle cx="35" cy="70" r="2" fill="#654321" />
                    </svg>
                    Ludo Conto Premium
                </h1>
                <div class="header-actions">
                    <button class="btn-historias" onclick="window.location.href='/'">🏠 Voltar</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Hero Section -->
            <section class="hero">
                <h2>🌟 Desbloqueie Todo o Potencial do Ludo Conto</h2>
                <p>Transforme a hora da historia em momentos magicos e inesqueciveis com seu filho</p>
            </section>

            <!-- Premium Card -->
            <div class="form-container" style="max-width: 600px; margin: 0 auto;">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h3 style="font-size: 2rem; color: #2d3748; margin-bottom: 1rem;">Ludo Conto Premium</h3>
                    <div style="font-size: 3rem; font-weight: 700; color: #ff6b6b; margin-bottom: 0.5rem;">R$ 9,99</div>
                    <div style="color: #666; margin-bottom: 2rem;">por mes</div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <div style="display: flex; align-items: center; margin-bottom: 1rem;">
                        <span style="color: #10b981; margin-right: 10px; font-weight: bold;">✓</span>
                        <span><strong>Historias ILIMITADAS</strong></span>
                    </div>
                    <div style="display: flex; align-items: center; margin-bottom: 1rem;">
                        <span style="color: #10b981; margin-right: 10px; font-weight: bold;">✓</span>
                        <span><strong>30 ilustracoes por mes</strong></span>
                    </div>
                    <div style="display: flex; align-items: center; margin-bottom: 1rem;">
                        <span style="color: #10b981; margin-right: 10px; font-weight: bold;">✓</span>
                        <span><strong>Ate 3 perfis de criancas</strong></span>
                    </div>
                    <div style="display: flex; align-items: center; margin-bottom: 1rem;">
                        <span style="color: #10b981; margin-right: 10px; font-weight: bold;">✓</span>
                        <span><strong>Sem anuncios</strong></span>
                    </div>
                    <div style="display: flex; align-items: center; margin-bottom: 1rem;">
                        <span style="color: #10b981; margin-right: 10px; font-weight: bold;">✓</span>
                        <span><strong>Suporte prioritario</strong></span>
                    </div>
                </div>

                <button id="premium-checkout" class="btn-gerar" style="width: 100%; margin-bottom: 1rem;">
                    <span class="btn-text">Assinar Premium Agora</span>
                    <div class="loading" style="display: none;">
                        <div class="spinner"></div>
                        <span>Processando...</span>
                    </div>
                </button>

                <div id="error-message"
                    style="background: #fee2e2; color: #dc2626; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; display: none;">
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase Auth e Functions -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDH02CAV-mEtQhhPmRJRuxiVKCJak4N3GA",
            authDomain: "ludoconto.firebaseapp.com",
            projectId: "ludoconto",
            storageBucket: "ludoconto.firebasestorage.app",
            messagingSenderId: "608733666496",
            appId: "1:608733666496:web:b638178ee15d7ca0732125",
            measurementId: "G-004YJNNFN9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const functions = getFunctions(app);

        // Disponibilizar globalmente
        window.firebaseAuth = auth;
        window.firebaseFunctions = functions;

        onAuthStateChanged(auth, (user) => {
            window.currentUser = user;
            if (!user) {
                // Se nao estiver logado, desabilitar botao
                const btn = document.getElementById('premium-checkout');
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="btn-text">Faça Login para Assinar</span>';
                    btn.onclick = () => {
                        alert('Faça login primeiro para assinar o Premium');
                        window.location.href = '/';
                    };
                }
            }
        });
    </script>

    <!-- Checkout via Firebase Functions -->
    <script>
        // Funcao para assinar premium
        document.getElementById('premium-checkout').addEventListener('click', async function () {
            const btn = this;
            const btnText = btn.querySelector('.btn-text');
            const btnLoading = btn.querySelector('.loading');
            const errorMessage = document.getElementById('error-message');

            try {
                if (!window.currentUser) {
                    alert('Faça login primeiro para assinar o Premium');
                    window.location.href = '/';
                    return;
                }

                // Mostrar loading
                btn.disabled = true;
                btnText.style.display = 'none';
                btnLoading.style.display = 'flex';
                errorMessage.style.display = 'none';

                // Aguardar Firebase Functions estar disponivel
                if (!window.firebaseFunctions) {
                    throw new Error('Firebase Functions não inicializado');
                }

                // Usar Firebase Functions global
                const { httpsCallable } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js');
                const criarCheckoutFunction = httpsCallable(window.firebaseFunctions, 'criarCheckoutSession');

                const result = await criarCheckoutFunction({
                    priceId: 'price_1RqIPF0Tz9khDe1DHsKNCcwu',
                    successUrl: window.location.origin + '/sucesso.html',
                    cancelUrl: window.location.origin + '/premium.html'
                });

                // Redirecionar para Stripe Checkout
                window.location.href = result.data.url;

            } catch (error) {
                console.error('Erro ao assinar:', error);

                errorMessage.textContent = error.message || 'Erro ao processar pagamento. Tente novamente.';
                errorMessage.style.display = 'block';

                btn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        });
    </script>
</body>

</html>"
